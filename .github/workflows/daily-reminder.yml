name: Daily date reminders

on:
  schedule:
    # GitHub Actions cron uses UTC and cannot apply an IANA timezone.  These
    # two times cover 8:00 AM in Chicago during standard and daylight time;
    # the time-check job below lets through only the one that is actually 8 AM.
    - cron: "0 13 * * *" # 8:00 AM CST
    - cron: "0 14 * * *" # 8:00 AM CDT
  workflow_dispatch:
    inputs:
      reminder_date:
        description: "Optional test date (YYYY-MM-DD)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  time-check:
    runs-on: ubuntu-latest
    outputs:
      should-send: ${{ steps.check.outputs.should-send }}
    steps:
      - id: check
        name: Confirm it is 8 AM in Chicago
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             [ "$(TZ=America/Chicago date +%H)" = "08" ]; then
            echo "should-send=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-send=false" >> "$GITHUB_OUTPUT"
          fi

  send-reminders:
    needs: time-check
    if: needs.time-check.outputs.should-send == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send reminders
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: >-
          python reminder.py
          ${{ github.event.inputs.reminder_date != '' && format('--date {0}', github.event.inputs.reminder_date) || '' }}
